# pnpm, Node and the workspace's dependencies. Run after actions/checkout.
name: Set up
description: Set up pnpm and Node, and install dependencies.

inputs:
  filter:
    description: Install only these packages (a pnpm --filter selector) instead of the whole workspace.
    default: ""

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 12

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile ${FILTER:+--filter "$FILTER"}
      env:
        FILTER: ${{ inputs.filter }}
