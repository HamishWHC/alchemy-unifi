# The checks every change gets: typecheck, lint, format, unit tests and the packed packages
# first, then in parallel the controller tests, the consumer smoke test and the docs build (the
# last two from the packed packages). Uploads the packages (`packed`) and the docs build (`docs`) as artifacts for the
# calling workflow's later jobs. Called by ci.yml (main) and pr.yml (pull requests).
name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: check + unit test + pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup

      - name: Check (typecheck, lint, format)
        run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      # The tarballs the smoke test and the docs build use, and that npm would get.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          for package in network-sdk network; do
            (cd "packages/$package" && pnpm pack --pack-destination "$RUNNER_TEMP/packed")
          done

      - name: Upload the packed packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed
          path: ${{ runner.temp }}/packed/*.tgz
          if-no-files-found: error

  controller-tests:
    name: controller tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup

      - name: Start the test controller
        run: pnpm --filter @alchemy-unifi/test-controller run up

      - name: Controller tests
        run: pnpm test:controller

      - name: Controller logs
        if: failure()
        working-directory: packages/test-controller
        run: docker compose logs --no-color --tail 300

  smoke:
    name: smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup
        with:
          filter: "@alchemy-unifi/test-controller..."

      - name: Download the packed packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed
          path: ${{ runner.temp }}/packed

      - name: Start the test controller
        run: pnpm --filter @alchemy-unifi/test-controller run up

      - name: Consumer smoke test (packed packages in a fresh npm project, and the docs tutorial)
        run: scripts/smoke/run.sh
        env:
          PACKED_DIR: ${{ runner.temp }}/packed

      - name: Controller logs
        if: failure()
        working-directory: packages/test-controller
        run: docker compose logs --no-color --tail 300

  # The docs site, with its reference generated from the packed provider.
  docs:
    name: docs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up
        uses: ./.github/actions/setup
        with:
          filter: "@alchemy-unifi/docs..."

      - name: Download the packed packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed
          path: ${{ runner.temp }}/packed

      - name: Build the docs from the packed provider
        run: |
          mkdir -p "$RUNNER_TEMP/network"
          tar -xzf "$RUNNER_TEMP"/packed/alchemy-unifi-network-[0-9]*.tgz -C "$RUNNER_TEMP/network"
          NETWORK_PACKAGE_DIR="$RUNNER_TEMP/network/package" pnpm --filter @alchemy-unifi/docs exec sh -c 'node scripts/generate-reference.ts && astro build'
        env:
          # A PR's build shows its number and commit in the header (on pushes, these are empty).
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload the docs build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: packages/docs/dist
          if-no-files-found: error
