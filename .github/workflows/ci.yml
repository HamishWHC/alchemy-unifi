name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check / test / build / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck, lint, format)
        run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: Start the test controller
        run: pnpm --filter @alchemy-unifi/test-controller run up

      - name: Controller tests
        run: pnpm test:controller

      - name: Consumer smoke test (packed packages in a fresh npm project)
        run: scripts/smoke/run.sh

      - name: Controller logs
        if: failure()
        working-directory: packages/test-controller
        run: docker compose logs --no-color --tail 300

  # Once CI passes on main, a nightly of each package's next version under the `nightly`
  # dist-tag (release.yml does the publishing; see docs/development/releasing.md).
  nightly:
    name: publish
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      nightly: true
