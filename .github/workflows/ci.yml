name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check / test / build / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (typecheck, lint, format)
        run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      # The tarballs the smoke test and the docs build use, and that npm would get.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          for package in network-sdk network; do
            (cd "packages/$package" && pnpm pack --pack-destination "$RUNNER_TEMP/packed")
          done

      - name: Upload the packed packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed
          path: ${{ runner.temp }}/packed/*.tgz
          if-no-files-found: error

      - name: Start the test controller
        run: pnpm --filter @alchemy-unifi/test-controller run up

      - name: Controller tests
        run: pnpm test:controller

      - name: Consumer smoke test (packed packages in a fresh npm project, and the docs tutorial)
        run: scripts/smoke/run.sh
        env:
          PACKED_DIR: ${{ runner.temp }}/packed

      - name: Controller logs
        if: failure()
        working-directory: packages/test-controller
        run: docker compose logs --no-color --tail 300

  # The docs site, with its reference generated from the packed provider.
  docs:
    name: docs
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @alchemy-unifi/docs...

      - name: Download the packed packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed
          path: ${{ runner.temp }}/packed

      - name: Build the docs from the packed provider
        run: |
          mkdir -p "$RUNNER_TEMP/network"
          tar -xzf "$RUNNER_TEMP"/packed/alchemy-unifi-network-[0-9]*.tgz -C "$RUNNER_TEMP/network"
          NETWORK_PACKAGE_DIR="$RUNNER_TEMP/network/package" pnpm --filter @alchemy-unifi/docs exec sh -c 'node scripts/generate-reference.ts && astro build'
        env:
          # A PR's build shows its number and commit in the header (on pushes, these are empty).
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload the docs build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs
          path: packages/docs/dist
          if-no-files-found: error

  # A preview of the docs on each pull request from this repository (forks get no secrets), shown
  # on the PR as a comment and a deployment. Removed when the PR closes (docs-preview-cleanup.yml).
  docs-preview:
    name: docs preview
    needs: [ci, docs]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: docs-pr-${{ github.event.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @alchemy-unifi/docs...

      - name: Download the docs build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs
          path: packages/docs/dist

      # Transient, so a deployment from one PR doesn't mark another PR's inactive.
      - name: Start the GitHub deployment
        id: deployment
        run: |
          id=$(jq -n --arg ref "$HEAD_REF" --argjson pr "$PULL_REQUEST" \
            '{ref: $ref, environment: "docs-preview", description: "Docs preview for PR #\($pr)", transient_environment: true, auto_merge: false, required_contexts: []}' |
            gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress > /dev/null
          echo "id=$id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PULL_REQUEST: ${{ github.event.number }}

      - name: Deploy the preview
        id: deploy
        working-directory: packages/docs
        run: |
          pnpm exec alchemy deploy --stage "pr-${{ github.event.number }}" --yes | tee "$RUNNER_TEMP/deploy.log"
          # The stack's outputs, as printed at the end of the deploy.
          echo "url=$(grep -o "url: 'https://[^']*'" "$RUNNER_TEMP/deploy.log" | tail -n 1 | cut -d "'" -f 2)" >> "$GITHUB_OUTPUT"
        env:
          DOCS_PREBUILT: "1"
          PULL_REQUEST: ${{ github.event.number }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Finish the GitHub deployment
        if: always() && steps.deployment.outputs.id != ''
        run: |
          args=(-f state="$([ "$OUTCOME" = success ] && echo success || echo failure)" -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          if [ -n "$URL" ]; then args+=(-f environment_url="$URL"); fi
          gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" "${args[@]}" > /dev/null
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.deployment.outputs.id }}
          OUTCOME: ${{ steps.deploy.outcome }}
          URL: ${{ steps.deploy.outputs.url }}

  # Once CI and the docs build pass on main, a nightly of each package's next version under the
  # `nightly` dist-tag, and the nightly docs (release.yml does both; see docs/development/releasing.md).
  nightly:
    name: publish
    needs: [ci, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      nightly: true
