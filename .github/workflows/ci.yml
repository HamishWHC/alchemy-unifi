# Pushes to main: the checks, then a nightly. Keeps the name ci.yml because npm trusts it to
# publish (see docs/development/releasing.md).
name: Main

on:
  push:
    branches: [main]

# Never cancelled: a nightly stopped partway could leave npm and the docs out of step.
concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  # Once CI and the docs build pass on main, a nightly of each package's next version under the
  # `nightly` dist-tag, and the nightly docs (release.yml does both; see docs/development/releasing.md).
  nightly:
    name: publish
    needs: checks
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      nightly: true
