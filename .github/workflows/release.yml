# Publishes to npm with trusted publishing (OIDC, no tokens) and provenance.
# npm trusts this file by name, so every kind of publish lives here.
# See docs/development/releasing.md.
name: Release

on:
  # Every push to main: a nightly of the next version, under the `nightly` dist-tag.
  push:
    branches: [main]
  # By hand on main: apply the pending change intents, then commit, tag and push the release,
  # and start this workflow on the new tag. On a tag: publish it under `latest` and create the
  # GitHub releases, so its provenance names the tagged release commit.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Update npm (trusted publishing needs 11.5.1 or later)
        run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Set nightly versions
        run: node scripts/release.ts nightly
      - name: Publish
        run: node scripts/release.ts publish nightly

  release:
    name: Release (version, commit, tag)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply change intents
        run: |
          if ! pnpm change status | grep -q '^Release plan:'; then
            echo "::error::No pending change intents. Record one with \`pnpm change\` first."
            exit 1
          fi
          pnpm change status
          pnpm version -r
          # pnpm writes changelogs and the ledger unformatted; format what it changed, as a commit would.
          { git diff --name-only --diff-filter=AM; git ls-files --others --exclude-standard; } | grep -E '\.(md|json|ya?ml)$' | xargs --no-run-if-empty ./node_modules/.bin/oxfmt

      - name: Commit, tag and push
        id: commit
        env:
          # The release commit only holds generated files, already formatted above; skip the hooks.
          LEFTHOOK: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          tags=$(node scripts/release.ts tags)
          git add -A
          git commit -m "Release $(echo $tags | sed 's/ /, /g')"
          # main may have moved while this ran; the release commit only touches manifests, changelogs and intents.
          git pull --rebase origin main
          for tag in $tags; do git tag "$tag"; done
          git push --atomic origin HEAD:main $tags
          echo "tag=$(echo "$tags" | head -n 1)" >> "$GITHUB_OUTPUT"

      # The workflow's own pushes don't trigger workflows, but its dispatches do.
      - name: Start the publish run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ steps.commit.outputs.tag }}"

  publish:
    name: Publish
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Every package's tag on this commit, not just the one this run was started on.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Update npm (trusted publishing needs 11.5.1 or later)
        run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Re-running this job is safe: it skips versions already on npm and tags that already have releases.
      - name: Publish
        run: node scripts/release.ts publish latest
      - name: Create GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.ts releases
