# Publishes to npm with trusted publishing (OIDC, no tokens) and provenance.
#
# - Run by hand on main: applies the pending change intents, commits, tags and pushes the
#   release, publishes it under `latest`, creates the GitHub releases and deploys the docs to
#   `prod`. With no pending intents, it only publishes and releases current versions that are
#   missing, and redeploys the docs (to finish a run that failed after pushing).
# - Called by ci.yml with `nightly: true` once CI passes on main: applies the intents without
#   committing, so the nightly carries the changelog so far, publishes a nightly of each
#   package under `nightly`, and deploys the docs to `nightly`.
#
# The packages are packed once, and the docs are built from those tarballs. Nothing is pushed,
# published or deployed unless both builds succeed, and npm gets exactly the tarballs the docs
# describe, before the docs go live.
#
# npm checks the calling workflow's filename, so it trusts both release.yml and ci.yml, each
# only from the `npm` environment.
# See docs/development/releasing.md.
name: Release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      nightly:
        description: Publish a nightly of the next version instead of releasing.
        type: boolean
        default: false

jobs:
  release:
    name: ${{ inputs.nightly && 'nightly' || 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm only accepts OIDC tokens from this environment, and GitHub only lets main deploy to it,
    # so a branch with an edited workflow can't publish.
    environment: npm
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Publish from main."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release tags, for the GitHub releases step.
          fetch-depth: 0
          # Releases push with a deploy key (an `npm` environment secret), which main's ruleset lets
          # bypass the pull-request rule; GITHUB_TOKEN can't be a bypass actor. Nightlies don't push.
          ssh-key: ${{ !inputs.nightly && secrets.RELEASE_DEPLOY_KEY || '' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Bumps the packages the intents name (and their dependents), prepends their changelogs and
      # deletes the consumed intents. Lists what it bumped; `[]` when there are no intents.
      - name: Apply change intents
        run: pnpm version -r --json --no-git-checks | tee "$RUNNER_TEMP/bumped.json"

      # A prerelease after the version the intents gave (or the current one). The manifests never
      # hold a committed nightly, so pnpm's own counter would restart at 0 every time: the UTC
      # timestamp and commit keep each nightly unique. The `g` keeps a SHA like `0123456` from being
      # a numeric identifier with a leading zero, which semver rejects.
      - name: Set nightly versions
        if: ${{ inputs.nightly }}
        run: pnpm --filter "./packages/network*" version -r prerelease --preid "nightly.$(date -u +%Y%m%d%H%M%S).g$(git rev-parse --short=7 HEAD)" --no-git-checks

      - name: Build
        run: pnpm build

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packed"
          for package in network-sdk network; do
            (cd "packages/$package" && pnpm pack --pack-destination "$RUNNER_TEMP/packed")
          done

      - name: Upload the packed packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-${{ inputs.nightly && 'nightly' || 'release' }}
          path: ${{ runner.temp }}/packed/*.tgz
          if-no-files-found: error

      - name: Build the docs from the packed provider
        run: |
          mkdir -p "$RUNNER_TEMP/network"
          tar -xzf "$RUNNER_TEMP"/packed/alchemy-unifi-network-[0-9]*.tgz -C "$RUNNER_TEMP/network"
          NETWORK_PACKAGE_DIR="$RUNNER_TEMP/network/package" pnpm --filter @alchemy-unifi/docs exec sh -c 'node scripts/generate-reference.ts && astro build'

      - name: Commit and tag
        id: tag
        if: ${{ !inputs.nightly }}
        run: |
          mapfile -t tags < <(jq -r '.[] | "\(.name)@\(.newVersion)"' "$RUNNER_TEMP/bumped.json")
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "::notice::No pending change intents: publishing and releasing current versions that are missing."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          message="Release $(printf '%s, ' "${tags[@]}")"
          git add -A
          git commit -m "${message%, }"
          for tag in "${tags[@]}"; do git tag "$tag"; done
          echo "tags=${tags[*]}" >> "$GITHUB_OUTPUT"

      # Before publishing, so a refused push publishes nothing.
      - name: Push
        if: ${{ steps.tag.outputs.tags }}
        env:
          TAGS: ${{ steps.tag.outputs.tags }}
        run: |
          read -ra tags <<< "$TAGS"
          git push --atomic origin HEAD:main "${tags[@]}"

      # The packed tarballs, SDK first, skipping versions npm already has.
      - name: Publish
        env:
          TAG: ${{ inputs.nightly && 'nightly' || 'latest' }}
        run: |
          for package in network-sdk network; do
            tarball=$(ls "$RUNNER_TEMP"/packed/alchemy-unifi-"$package"-[0-9]*.tgz)
            spec=$(tar -xOzf "$tarball" package/package.json | jq -r '"\(.name)@\(.version)"')
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "::notice::$spec is already on npm."
              continue
            fi
            pnpm publish "$tarball" --provenance --no-git-checks --tag "$TAG"
          done

      # One per public package whose current version is tagged but has no release yet, with the
      # newest section of its changelog as notes.
      - name: Create GitHub releases
        if: ${{ !inputs.nightly }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for manifest in packages/*/package.json; do
            jq -e '.private != true' "$manifest" >/dev/null || continue
            tag=$(jq -r '"\(.name)@\(.version)"' "$manifest")
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || continue
            gh release view "$tag" >/dev/null 2>&1 && continue
            awk '/^## /{n++; next} n==1' "$(dirname "$manifest")/CHANGELOG.md" | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          done

      # After npm has the packages, so the docs never describe a version it doesn't have.
      - name: Deploy the docs
        working-directory: packages/docs
        run: pnpm exec alchemy deploy --stage ${{ inputs.nightly && 'nightly' || 'prod' }} --yes
        env:
          DOCS_PREBUILT: "1"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
